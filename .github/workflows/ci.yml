name: CI
on:
  push: null
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run repository verification (main)
        run: npm run verify -- --profile main --output "${{ runner.temp }}/verification-verify"
      - name: Retain verification plan, logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-verify-${{ strategy.job-index }}
          path: ${{ runner.temp }}/verification-verify
          if-no-files-found: error
  semantic-platform-smoke:
    name: Semantic smoke (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-x64
            runner: macos-15-intel
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install latest stable OpenCode
        run: node scripts/install-opencode-release.mjs --platform ${{ matrix.platform }} --output "${{ runner.temp }}/opencode"
      - name: Run repository verification (semantic)
        run: npm run verify -- --profile semantic --output "${{ runner.temp }}/verification-semantic-platform-smoke"
        env:
          OPENCODE_BIN: ${{ runner.temp }}/opencode/package/bin/opencode
      - name: Retain verification plan, logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-semantic-platform-smoke-${{ strategy.job-index }}
          path: ${{ runner.temp }}/verification-semantic-platform-smoke
          if-no-files-found: error
  opencode-host-contract:
    name: OpenCode host contract (${{ matrix.opencode }})
    strategy:
      fail-fast: false
      matrix:
        opencode:
          - latest
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install latest stable OpenCode
        run: node scripts/install-opencode-release.mjs --platform linux-x64 --output "${{ runner.temp }}/opencode"
      - name: Check out AgenticReplay source for wrapped contract
        uses: actions/checkout@v6
        with:
          repository: askdkc/AgenticReplay
          path: agenticreplay-source
      - name: Build and pack AgenticReplay for wrapped contract
        working-directory: agenticreplay-source
        run: |
          npm ci
          npm pack --json --pack-destination "${{ runner.temp }}" > "${{ runner.temp }}/agenticreplay-pack.json"
          node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))[0]; console.log(JSON.stringify({id:p.id,filename:p.filename,integrity:p.integrity}))' "${{ runner.temp }}/agenticreplay-pack.json"
          git rev-parse HEAD
      - name: Install the packed AgenticReplay
        run: |
          archive=$(node -e 'const fs = require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1], "utf8"))[0].filename)' "${{ runner.temp }}/agenticreplay-pack.json")
          npm install --prefix "${{ runner.temp }}/agenticreplay" "${{ runner.temp }}/$archive"
      - name: Run repository verification (host)
        run: npm run verify -- --profile host --output "${{ runner.temp }}/verification-opencode-host-contract"
        env:
          OPENCODE_BIN: ${{ runner.temp }}/opencode/package/bin/opencode
          KIOKUKO_TEST_AGENTICREPLAY: ${{ runner.temp }}/agenticreplay/node_modules/.bin/agenticreplay
      - name: Retain verification plan, logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-opencode-host-contract-${{ strategy.job-index }}
          path: ${{ runner.temp }}/verification-opencode-host-contract
          if-no-files-found: error
