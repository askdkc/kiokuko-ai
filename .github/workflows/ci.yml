name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Verify OpenCode-only public boundary
        run: npm run verify:opencode-boundary

      - name: Build package
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Run semantic retrieval evaluation
        run: npm run test:evaluation

      - name: Verify sqlite-vec package and production composition
        run: npm run test:sqlite-vec
        env:
          KIOKUKO_REQUIRE_SQLITE_VEC_SMOKE: "1"

      - name: Verify fresh-schema sample database and Web API
        run: npm run test:sampledb

      - name: Verify package contents
        run: npm run pack:check

      - name: Verify minimal global install
        run: npm run test:global-install

      - name: Verify pinned local embedding manifest
        run: node scripts/run-local-embedding-smoke.mjs --offline

  semantic-platform-smoke:
    name: Semantic smoke (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-x64
            runner: macos-15-intel
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify sqlite-vec package and production composition
        run: npm run test:sqlite-vec
        env:
          KIOKUKO_REQUIRE_SQLITE_VEC_SMOKE: "1"

      - name: Verify pinned local embedding manifest
        run: node scripts/run-local-embedding-smoke.mjs --offline

      - name: Install latest stable OpenCode
        run: node scripts/install-opencode-release.mjs --platform ${{ matrix.platform }} --output "${{ runner.temp }}/opencode"

      - name: Run OpenCode platform host smoke
        run: npm run test:e2e:opencode:host
        env:
          OPENCODE_BIN: ${{ runner.temp }}/opencode/package/bin/opencode

  opencode-host-contract:
    name: OpenCode host contract (${{ matrix.opencode }})
    strategy:
      fail-fast: false
      matrix:
        opencode: [latest]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install latest stable OpenCode
        run: node scripts/install-opencode-release.mjs --platform linux-x64 --output "${{ runner.temp }}/opencode"

      - name: Run required host contract
        run: npm run test:e2e:opencode:host
        env:
          OPENCODE_BIN: ${{ runner.temp }}/opencode/package/bin/opencode

      - name: Verify packed role dispatch, continuation, and compaction
        run: node scripts/run-opencode-execution-e2e.mjs
        env:
          OPENCODE_BIN: ${{ runner.temp }}/opencode/package/bin/opencode

      - name: Check out AgenticReplay source for wrapped contract
        uses: actions/checkout@v6
        with:
          repository: askdkc/AgenticReplay
          path: agenticreplay-source

      - name: Build and pack AgenticReplay for wrapped contract
        working-directory: agenticreplay-source
        run: |
          npm ci
          npm pack --json --pack-destination "${{ runner.temp }}" > "${{ runner.temp }}/agenticreplay-pack.json"
          node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))[0]; console.log(JSON.stringify({id:p.id,filename:p.filename,integrity:p.integrity}))' "${{ runner.temp }}/agenticreplay-pack.json"
          git rev-parse HEAD

      - name: Install the packed AgenticReplay
        run: |
          archive=$(node -e 'const fs = require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1], "utf8"))[0].filename)' "${{ runner.temp }}/agenticreplay-pack.json")
          npm install --prefix "${{ runner.temp }}/agenticreplay" "${{ runner.temp }}/$archive"

      - name: Verify wrapped MCP and interrupted stream recovery
        run: npm run test:e2e:opencode:agenticreplay | tee "${{ runner.temp }}/wrapped-contract.log"
        env:
          OPENCODE_BIN: ${{ runner.temp }}/opencode/package/bin/opencode
          KIOKUKO_TEST_AGENTICREPLAY: ${{ runner.temp }}/agenticreplay/node_modules/.bin/agenticreplay

      - name: Retain wrapped contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-wrapped-contract
          path: |
            ${{ runner.temp }}/agenticreplay-pack.json
            ${{ runner.temp }}/wrapped-contract.log
          if-no-files-found: ignore
